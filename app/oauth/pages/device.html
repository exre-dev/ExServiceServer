<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EXRE 社区 - 设备授权</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.08); width: 380px; padding: 32px; }
  h1 { font-size: 20px; text-align: center; margin-bottom: 6px; }
  .sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 22px; }
  label { display: block; font-size: 13px; color: #555; margin-bottom: 4px; }
  input { width: 100%; padding: 9px 10px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; margin-bottom: 14px; outline: none; letter-spacing: 4px; text-align: center; }
  input:focus { border-color: #1677ff; }
  button { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; background: #1677ff; color: #fff; }
  .msg { font-size: 13px; color: #e54545; text-align: center; min-height: 18px; margin-bottom: 8px; }
  .ok-note { text-align: center; color: #52c41a; font-size: 14px; padding: 16px 0; }
  .muted { color: #999; font-size: 12px; text-align: center; margin-top: 14px; }
</style>
</head>
<body>
<div class="card">
  <h1>EXRE 社区</h1>
  <div class="sub">游戏设备授权</div>

  <div id="step-login">
    <label>邮箱</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="username">
    <label>密码</label>
    <input id="password" type="password" placeholder="密码" autocomplete="current-password">
    <div class="msg" id="msg"></div>
    <button id="btn-login">登录</button>
  </div>

  <div id="step-verify" style="display:none">
    <label>游戏内显示的 6 位验证码</label>
    <input id="user-code" maxlength="6" inputmode="numeric" placeholder="000000">
    <div class="msg" id="verify-msg"></div>
    <button id="btn-verify">确认授权</button>
    <div class="muted">确认后游戏内插件将自动完成登录，可在账号安全中心随时撤销</div>
  </div>

  <div id="step-done" style="display:none">
    <div class="ok-note" id="done-note">授权成功，请回到游戏</div>
  </div>
</div>

<script>
var TOKEN = sessionStorage.getItem('exre_oauth_token') || '';
function api(method, path, body) {
  return fetch('/api' + path, {
    method: method,
    headers: Object.assign({ 'Content-Type': 'application/json' },
      TOKEN ? { 'Authorization': 'Bearer ' + TOKEN } : {}),
    body: body ? JSON.stringify(body) : undefined
  }).then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); });
}
function $(id) { return document.getElementById(id); }
function showVerify() { $('step-login').style.display = 'none'; $('step-verify').style.display = 'block'; }
if (TOKEN) showVerify();

$('btn-login').onclick = function () {
  $('msg').textContent = '';
  api('POST', '/account/login', { email: $('email').value.trim(), password: $('password').value }).then(function (r) {
    if (r.status !== 200) { $('msg').textContent = (r.body && r.body.msg) || '登录失败'; return; }
    TOKEN = r.body.data.token;
    sessionStorage.setItem('exre_oauth_token', TOKEN);
    showVerify();
  });
};
$('btn-verify').onclick = function () {
  $('verify-msg').textContent = '';
  api('POST', '/oauth/device/verify', { user_code: $('user-code').value.trim() }).then(function (r) {
    if (r.status !== 200) { $('verify-msg').textContent = (r.body && r.body.msg) || '验证失败'; return; }
    $('step-verify').style.display = 'none';
    $('done-note').textContent = r.body.msg || '授权成功，请回到游戏';
    $('step-done').style.display = 'block';
    sessionStorage.removeItem('exre_oauth_token');
  });
};
$('password').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('btn-login').click(); });
$('user-code').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('btn-verify').click(); });
</script>
</body>
</html>
