components:
  responses:
    BusinessError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessErrorBody'
      description: '业务错误；HTTP 状态码由接口具体分支决定。'
    SetupRequired:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessErrorBody'
      description: 系统尚未初始化。
      headers:
        X-Setup-Required:
          description: '值为 1，提示先完成初始化。'
          schema:
            enum:
              - '1'
            type: string
  schemas:
    BusinessErrorBody:
      $ref: './schemas/common.yaml#/BusinessErrorBody'
    OAuthAuthorizationCodeRequest:
      $ref: './schemas/oauth.yaml#/OAuthAuthorizationCodeRequest'
    OAuthAuthorizationPending:
      $ref: './schemas/oauth.yaml#/OAuthAuthorizationPending'
    OAuthDeviceInitRequest:
      $ref: './schemas/oauth.yaml#/OAuthDeviceInitRequest'
    OAuthDeviceInitResponse:
      $ref: './schemas/oauth.yaml#/OAuthDeviceInitResponse'
    OAuthDeviceTokenRequest:
      $ref: './schemas/oauth.yaml#/OAuthDeviceTokenRequest'
    OAuthTokenResponse:
      $ref: './schemas/oauth.yaml#/OAuthTokenResponse'
    PluginBindSelfRequest:
      $ref: './schemas/plugin.yaml#/PluginBindSelfRequest'
    PluginBindSelfResponse:
      $ref: './schemas/plugin.yaml#/PluginBindSelfResponse'
    PluginBindTicketRequest:
      $ref: './schemas/plugin.yaml#/PluginBindTicketRequest'
    PluginBindTicketResponse:
      $ref: './schemas/plugin.yaml#/PluginBindTicketResponse'
    PluginFeatures:
      $ref: './schemas/plugin.yaml#/PluginFeatures'
    PluginLicenseRequest:
      $ref: './schemas/plugin.yaml#/PluginLicenseRequest'
    PluginLicenseResponse:
      $ref: './schemas/plugin.yaml#/PluginLicenseResponse'
    PluginMemberPermission:
      $ref: './schemas/plugin.yaml#/PluginMemberPermission'
    PluginOAuthIdent:
      $ref: './schemas/plugin.yaml#/PluginOAuthIdent'
    PluginOAuthPermission:
      $ref: './schemas/plugin.yaml#/PluginOAuthPermission'
    PluginOAuthServer:
      $ref: './schemas/plugin.yaml#/PluginOAuthServer'
    PluginOAuthUserInfoResponse:
      $ref: './schemas/plugin.yaml#/PluginOAuthUserInfoResponse'
    PluginPermissionBatchResponse:
      $ref: './schemas/plugin.yaml#/PluginPermissionBatchResponse'
    PluginPermissionRevisionResponse:
      $ref: './schemas/plugin.yaml#/PluginPermissionRevisionResponse'
    PluginTelemetryRequest:
      $ref: './schemas/plugin.yaml#/PluginTelemetryRequest'
    PluginTelemetryResponse:
      $ref: './schemas/plugin.yaml#/PluginTelemetryResponse'
  securitySchemes:
    bindCodeAuth:
      description: 插件绑定码。
      in: header
      name: X-Bind-Code
      type: apiKey
    oauthBearer:
      description: 'OAuth 访问令牌。'
      scheme: bearer
      type: http
    sessionAuth:
      description: '会话 JWT，保留会话撤销和用户状态校验。'
      scheme: bearer
      type: http
