components:
  responses:
    BusinessError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessErrorBody'
      description: '业务错误；HTTP 状态码由接口具体分支决定。'
    SetupRequired:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BusinessErrorBody'
      description: 系统尚未初始化。
      headers:
        X-Setup-Required:
          description: '值为 1，提示先完成初始化。'
          schema:
            enum:
              - '1'
            type: string
  schemas:
    AccountAdminLoginRequest:
      properties:
        captcha:
          $ref: '#/components/schemas/AccountCaptchaAnswer'
        email:
          format: email
          type: string
        password:
          format: password
          type: string
      required:
        - email
        - password
        - captcha
      type: object
    AccountAvatarRequest:
      properties:
        imageBase64:
          description: '无 data: 前缀的原始图片 base64 字节；解码后最多 2MiB'
          format: byte
          type: string
        mediaType:
          enum:
            - image/png
            - image/jpeg
            - image/webp
          type: string
      required:
        - imageBase64
        - mediaType
      type: object
    AccountCaptchaAnswer:
      properties:
        answer:
          type: string
        challengeId:
          description: '实际 PHP 请求与响应结构。'
          type: string
      required:
        - challengeId
        - answer
      type: object
    AccountCaptchaData:
      properties:
        challengeId:
          type: string
        expiresAt:
          description: 'Unix 时间戳（秒）'
          format: int64
          type: integer
        imageBase64:
          description: 'PNG 图片字节 base64，无 data: 前缀'
          format: byte
          type: string
      required:
        - challengeId
        - imageBase64
        - expiresAt
      type: object
    AccountCaptchaResponse:
      properties:
        data:
          $ref: '#/components/schemas/AccountCaptchaData'
        msg:
          type: string
      required:
        - msg
        - data
      type: object
    AccountEmailCodeResponse:
      properties:
        data:
          oneOf:
            -
              items:
                type: string
              maxItems: 0
              type: array
            -
              properties:
                debug_code:
                  type: string
              required:
                - debug_code
              type: object
        msg:
          type: string
      required:
        - msg
        - data
      type: object
    AccountEmailRequest:
      properties:
        email:
          format: email
          type: string
      required:
        - email
      type: object
    AccountEmptyResponse:
      properties:
        data:
          items:
            type: string
          maxItems: 0
          type: array
        msg:
          type: string
      required:
        - msg
        - data
      type: object
    AccountGrant:
      properties:
        app_name:
          type: string
        app_status:
          nullable: true
          type: string
        app_type:
          nullable: true
          type: string
        client_id:
          type: string
        granted_time:
          nullable: true
          type: string
        revoked_time:
          nullable: true
          type: string
        scopes:
          items:
            type: string
          type: array
        status:
          type: string
      required:
        - client_id
        - app_name
        - app_type
        - app_status
        - scopes
        - status
        - granted_time
        - revoked_time
      type: object
    AccountGrantsData:
      properties:
        list:
          items:
            $ref: '#/components/schemas/AccountGrant'
          type: array
      required:
        - list
      type: object
    AccountGrantsResponse:
      properties:
        data:
          $ref: '#/components/schemas/AccountGrantsData'
        msg:
          type: string
      required:
        - msg
        - data
      type: object
    AccountInvitationCheckData:
      properties:
        email:
          format: email
          type: string
        resendAvailableAt:
          description: 'Unix 时间戳（秒）'
          format: int64
          type: integer
        serverTime:
          description: 'Unix 时间戳（秒）'
          format: int64
          type: integer
        status:
          enum:
            - eligible
          type: string
      required:
        - status
        - email
        - serverTime
        - resendAvailableAt
      type: object
    AccountInvitationCheckResponse:
      properties:
        data:
          $ref: '#/components/schemas/AccountInvitationCheckData'
        msg:
          type: string
      required:
        - msg
        - data
      type: object
    AccountInvitationCodeData:
      properties:
        debug_code:
          description: '邮件发送失败且 debug 开启时存在'
          type: string
        resendAvailableAt:
          description: 'Unix 时间戳（秒）'
          format: int64
          type: integer
        serverTime:
          description: 'Unix 时间戳（秒）'
          format: int64
          type: integer
        status:
          enum:
            - accepted
          type: string
      required:
        - status
        - serverTime
        - resendAvailableAt
      type: object
    AccountInvitationCodeResponse:
      properties:
        data:
          $ref: '#/components/schemas/AccountInvitationCodeData'
        msg:
          type: string
      required:
        - msg
        - data
      type: object
    AccountInvitationCompleteData:
      properties:
        email:
          type: string
        status:
          enum:
            - registered
          type: string
      required:
        - status
        - email
      type: object
    AccountInvitationCompleteRequest:
      properties:
        completionToken:
          description: 十分钟一次性完成令牌
          type: string
        nickname:
          maxLength: 32
          minLength: 1
          type: string
        password:
          format: password
          maxLength: 64
          minLength: 8
          type: string
      required:
        - completionToken
        - nickname
        - password
      type: object
    AccountInvitationCompleteResponse:
      properties:
        data:
          $ref: '#/components/schemas/AccountInvitationCompleteData'
        msg:
          type: string
      required:
        - msg
        - data
      type: object
    AccountInvitationVerifyData:
      properties:
        completionExpiresAt:
          description: 'Unix 时间戳（秒）'
          format: int64
          type: integer
        completionToken:
          type: string
        email:
          type: string
        nickname:
          type: string
        serverTime:
          description: 'Unix 时间戳（秒）'
          format: int64
          type: integer
        status:
          enum:
            - verified
          type: string
      required:
        - status
        - completionToken
        - email
        - nickname
        - serverTime
        - completionExpiresAt
      type: object
    AccountInvitationVerifyRequest:
      properties:
        captcha:
          $ref: '#/components/schemas/AccountCaptchaAnswer'
        code:
          type: string
        email:
          format: email
          type: string
      required:
        - email
        - code
      type: object
    AccountInvitationVerifyResponse:
      properties:
        data:
          $ref: '#/components/schemas/AccountInvitationVerifyData'
        msg:
          type: string
      required:
        - msg
        - data
      type: object
    AccountLoginData:
      properties:
        expires_in:
          description: 有效期秒数
          type: integer
        token:
          type: string
        user:
          $ref: '#/components/schemas/AccountLoginUser'
      required:
        - token
        - expires_in
        - user
      type: object
    AccountLoginRequest:
      properties:
        captcha:
          $ref: '#/components/schemas/AccountCaptchaAnswer'
        email:
          format: email
          type: string
        password:
          format: password
          type: string
      required:
        - email
        - password
      type: object
    AccountLoginResponse:
      properties:
        data:
          $ref: '#/components/schemas/AccountLoginData'
        msg:
          type: string
      required:
        - msg
        - data
      type: object
    AccountLoginUser:
      properties:
        avatar:
          nullable: true
          type: string
        email:
          format: email
          type: string
        id:
          type: integer
        platform_role:
          description: '注册后当前模型未刷新数据库默认值，此分支可为 null；登录从数据库读取后为字符串'
          nullable: true
          type: string
        username:
          type: string
      required:
        - id
        - email
        - username
        - avatar
        - platform_role
      type: object
    AccountMeData:
      properties:
        avatar:
          nullable: true
          type: string
        email:
          format: email
          type: string
        id:
          type: integer
        last_login_time:
          description: '数据库时间 Y-m-d H:i:s'
          nullable: true
          type: string
        platform_role:
          type: string
        qq:
          nullable: true
          type: string
        username:
          type: string
      required:
        - id
        - email
        - username
        - avatar
        - platform_role
        - qq
        - last_login_time
      type: object
    AccountMeResponse:
      properties:
        data:
          $ref: '#/components/schemas/AccountMeData'
        msg:
          type: string
      required:
        - msg
        - data
      type: object
    AccountPasswordRequest:
      properties:
        new_password:
          format: password
          minLength: 6
          type: string
        old_password:
          format: password
          type: string
      required:
        - old_password
        - new_password
      type: object
    AccountProfileRequest:
      minProperties: 1
      properties:
        avatar:
          description: '仅 null 清除头像；其他值忽略'
          nullable: true
          type: string
        fivemId:
          description: '仅允许 null；其他值返回 400'
          nullable: true
          type: string
        nickname:
          maxLength: 32
          minLength: 1
          type: string
        qq:
          maxLength: 20
          nullable: true
          type: string
      type: object
    AccountRegisterRequest:
      properties:
        code:
          type: string
        email:
          format: email
          type: string
        password:
          format: password
          minLength: 6
          type: string
        qq:
          type: string
        username:
          type: string
      required:
        - email
        - password
      type: object
    AccountRevokeAllData:
      properties:
        revoked:
          type: integer
      required:
        - revoked
      type: object
    AccountRevokeAllResponse:
      properties:
        data:
          $ref: '#/components/schemas/AccountRevokeAllData'
        msg:
          type: string
      required:
        - msg
        - data
      type: object
    AccountRevokedSessionsData:
      properties:
        revoked_sessions:
          type: integer
      required:
        - revoked_sessions
      type: object
    AccountRevokedSessionsResponse:
      properties:
        data:
          $ref: '#/components/schemas/AccountRevokedSessionsData'
        msg:
          type: string
      required:
        - msg
        - data
      type: object
    AccountSession:
      properties:
        client_id:
          nullable: true
          type: string
        created_time:
          description: '数据库时间 Y-m-d H:i:s'
          nullable: true
          type: string
        current:
          type: boolean
        device_name:
          type: string
        expires_time:
          description: '数据库时间 Y-m-d H:i:s'
          nullable: true
          type: string
        id:
          type: integer
        ip:
          type: string
        last_used_time:
          description: '数据库时间 Y-m-d H:i:s'
          nullable: true
          type: string
        login_type:
          enum:
            - password
            - oauth
          type: string
        platform:
          type: string
        scope:
          type: string
        status:
          enum:
            - active
            - revoked
            - expired
          type: string
        ua_hash:
          type: string
        updated_time:
          description: '数据库时间 Y-m-d H:i:s'
          nullable: true
          type: string
        user_id:
          type: integer
      required:
        - id
        - user_id
        - login_type
        - client_id
        - device_name
        - platform
        - ip
        - ua_hash
        - scope
        - status
        - created_time
        - last_used_time
        - expires_time
        - updated_time
        - current
      type: object
    AccountSessionsData:
      properties:
        list:
          items:
            $ref: '#/components/schemas/AccountSession'
          type: array
      required:
        - list
      type: object
    AccountSessionsResponse:
      properties:
        data:
          $ref: '#/components/schemas/AccountSessionsData'
        msg:
          type: string
      required:
        - msg
        - data
      type: object
    AccountUnhandledErrorBody:
      description: '现有异常处理器返回 JSON 编码的 {message} 文本，响应沿用 text/html 类型'
      example: '{"message":"请求过于频繁"}'
      type: string
    AdminAffected:
      description: 按批次撤回或删除的通知回执数。
      properties:
        affected:
          type: integer
      required:
        - affected
      type: object
    AdminAuditLog:
      description: '审计日志；detail 为各动作自己的 JSON 详情。'
      properties:
        action:
          description: '动作名,如 user.login / binding.revoke'
          type: string
        actor_type:
          description: '操作者类型: platform/server/user/client'
          type: string
        actor_user_id:
          description: '操作者用户id,系统操作为空'
          nullable: true
          type: integer
        client_id:
          description: 相关应用client_id
          nullable: true
          type: string
        created_time:
          description: 记录时间
          nullable: true
          type: string
        detail:
          additionalProperties: true
          description: 详情JSON
          nullable: true
          type: object
        id:
          description: 主键
          type: integer
        ip:
          description: 来源IP
          type: string
        server_id:
          description: 相关空间id
          nullable: true
          type: integer
        target_id:
          description: 目标id
          type: string
        target_type:
          description: 目标类型
          type: string
      type: object
    AdminAuthSession:
      description: '会话完整字段，包括当前模型未隐藏的 ua_hash。'
      properties:
        client_id:
          description: OAuth时关联的应用client_id
          nullable: true
          type: string
        created_time:
          description: 登录时间
          nullable: true
          type: string
        device_name:
          description: 设备名(UA自动识别)
          type: string
        expires_time:
          description: 会话过期时间
          nullable: true
          type: string
        id:
          description: '会话id,即JWT中的sid'
          type: integer
        ip:
          description: 登录来源IP
          type: string
        last_used_time:
          description: 最近使用时间
          nullable: true
          type: string
        login_type:
          description: '登录方式: password/oauth'
          type: string
        platform:
          description: '平台: web/fivem/third_party'
          type: string
        scope:
          description: OAuth时授予的scope
          type: string
        status:
          description: '状态: active/revoked/expired'
          type: string
        ua_hash:
          description: UA摘要
          type: string
        updated_time:
          description: 更新时间
          nullable: true
          type: string
        user_id:
          description: 归属用户id
          type: integer
      type: object
    AdminBindingListItem:
      description: '全局绑定码列表；health：inactive 非 active、never 未心跳、stale 超过1800秒、ok 正常。'
      properties:
        code:
          description: '绑定码 EX-XXXX-XXXX-XXXX-XXXX-XXXX'
          type: string
        created_by:
          description: 生成者用户id
          nullable: true
          type: integer
        created_time:
          description: 创建时间
          nullable: true
          type: string
        expires_time:
          description: '过期时间,空=长期'
          nullable: true
          type: string
        features:
          description: '功能键到布尔值的映射；空映射经模型 array cast 输出 []'
          oneOf:
            -
              additionalProperties:
                type: boolean
              type: object
            -
              items:
                type: boolean
              maxItems: 0
              type: array
        health:
          enum:
            - inactive
            - never
            - stale
            - ok
          type: string
        id:
          description: 主键
          type: integer
        last_heartbeat:
          description: 最近心跳时间
          nullable: true
          type: string
        last_heartbeat_ip:
          description: 最近心跳来源IP
          type: string
        plugin:
          oneOf:
            -
              $ref: '#/components/schemas/AdminPluginBrief'
            -
              enum:
                - null
              nullable: true
              type: object
        plugin_id:
          description: 插件id
          type: integer
        server:
          oneOf:
            -
              $ref: '#/components/schemas/AdminServerStateBrief'
            -
              enum:
                - null
              nullable: true
              type: object
        server_id:
          description: 空间id
          type: integer
        server_key_hash:
          description: '首次校验锁定的sv_licenseKey SHA-256'
          type: string
        status:
          description: '状态: active/revoked/disabled'
          type: string
        updated_time:
          description: 更新时间
          nullable: true
          type: string
      type: object
    AdminBindingWithPlugin:
      description: 空间详情中的绑定码及关联插件。
      properties:
        code:
          description: '绑定码 EX-XXXX-XXXX-XXXX-XXXX-XXXX'
          type: string
        created_by:
          description: 生成者用户id
          nullable: true
          type: integer
        created_time:
          description: 创建时间
          nullable: true
          type: string
        expires_time:
          description: '过期时间,空=长期'
          nullable: true
          type: string
        features:
          description: '功能键到布尔值的映射；空映射经模型 array cast 输出 []'
          oneOf:
            -
              additionalProperties:
                type: boolean
              type: object
            -
              items:
                type: boolean
              maxItems: 0
              type: array
        id:
          description: 主键
          type: integer
        last_heartbeat:
          description: 最近心跳时间
          nullable: true
          type: string
        last_heartbeat_ip:
          description: 最近心跳来源IP
          type: string
        plugin:
          oneOf:
            -
              $ref: '#/components/schemas/AdminPluginBrief'
            -
              enum:
                - null
              nullable: true
              type: object
        plugin_id:
          description: 插件id
          type: integer
        server_id:
          description: 空间id
          type: integer
        server_key_hash:
          description: '首次校验锁定的sv_licenseKey SHA-256'
          type: string
        status:
          description: '状态: active/revoked/disabled'
          type: string
        updated_time:
          description: 更新时间
          nullable: true
          type: string
      type: object
    AdminClientCreated:
      description: 注册应用结果，明文密钥仅本次返回。
      properties:
        client_id:
          type: string
        client_secret:
          description: 明文密钥仅本次返回，请立即保存。
          type: string
        id:
          type: integer
      required:
        - id
        - client_id
        - client_secret
      type: object
    AdminClientListItem:
      description: 应用列表及关联空间，不含密钥哈希。
      properties:
        client_id:
          description: 公开client_id
          type: string
        created_by:
          description: 创建者用户id
          nullable: true
          type: integer
        created_time:
          description: 创建时间
          nullable: true
          type: string
        id:
          description: 主键
          type: integer
        name:
          description: 应用名称
          type: string
        note:
          description: '对接备注,仅超管可见'
          type: string
        redirect_uris:
          items:
            type: string
          type: array
        scopes:
          items:
            type: string
          type: array
        server:
          oneOf:
            -
              $ref: '#/components/schemas/AdminServerBrief'
            -
              enum:
                - null
              nullable: true
              type: object
        server_id:
          description: 'plugin类应用归属空间id,空=平台级'
          nullable: true
          type: integer
        status:
          description: '状态: active/suspended'
          type: string
        type:
          description: '类型: third_party/plugin'
          type: string
        updated_time:
          description: 更新时间
          nullable: true
          type: string
      type: object
    AdminClientSecret:
      description: 重置应用密钥结果，旧应用会话全部撤销。
      properties:
        client_id:
          type: string
        client_secret:
          description: 明文密钥仅本次返回，请立即保存。
          type: string
      required:
        - client_id
        - client_secret
      type: object
    AdminDashboard:
      description: '平台统计及最近10条审计日志；失联统计仅包括已锁定服务器 hash 的 active 绑定码。'
      properties:
        bindings:
          properties:
            active:
              type: integer
            disabled:
              type: integer
            revoked:
              type: integer
            stale_heartbeat:
              type: integer
          type: object
        plugins:
          properties:
            online:
              type: integer
            total:
              type: integer
          type: object
        recent_logs:
          items:
            $ref: '#/components/schemas/AdminAuditLog'
          type: array
        servers:
          properties:
            active:
              type: integer
            closed:
              type: integer
            suspended:
              type: integer
          type: object
        users:
          properties:
            banned:
              type: integer
            total:
              type: integer
          type: object
      type: object
    AdminDoc:
      description: 平台文档完整字段。
      properties:
        author_user_id:
          description: 作者用户id
          nullable: true
          type: integer
        category_id:
          description: 分类id
          nullable: true
          type: integer
        content_md:
          description: 正文Markdown
          type: string
        created_time:
          description: 创建时间
          nullable: true
          type: string
        id:
          description: 主键
          type: integer
        owner_type:
          description: '归属: platform/server'
          type: string
        server_id:
          description: owner_type=server时的空间id
          nullable: true
          type: integer
        slug:
          description: 全局唯一URL标识
          type: string
        status:
          description: '状态: draft/published'
          type: string
        title:
          description: 标题
          type: string
        updated_time:
          description: 更新时间
          nullable: true
          type: string
        version:
          description: 版本号
          type: integer
        visibility:
          description: '可见性: public/login/members/roles/servers/tags'
          type: string
        visible_roles:
          items:
            type: string
          nullable: true
          type: array
        visible_servers:
          items:
            type: integer
          nullable: true
          type: array
        visible_tags:
          items:
            type: integer
          nullable: true
          type: array
      type: object
    AdminDocCategory:
      description: 平台文档分类。
      properties:
        created_time:
          description: 创建时间
          nullable: true
          type: string
        id:
          description: 主键
          type: integer
        name:
          description: 分类名
          type: string
        owner_type:
          description: '归属: platform/server'
          type: string
        server_id:
          description: owner_type=server时的空间id
          nullable: true
          type: integer
