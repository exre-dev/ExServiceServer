      operationId: adminNotificationCreate
      requestBody:
        content:
          application/json:
            schema:
              properties:
                actions:
                  description: '动作数组或编码该数组的 JSON 字符串；控制器不逐字段校验，按原样存储。'
                  oneOf:
                    -
                      items:
                        additionalProperties: true
                        properties:
                          actionId:
                            type: string
                          emphasis:
                            type: string
                          enabled:
                            type: boolean
                          kind:
                            type: string
                          label:
                            type: string
                          navigationTarget:
                            additionalProperties: true
                            type: object
                          unavailableReason:
                            nullable: true
                            type: string
                        type: object
                      type: array
                    -
                      type: string
                body_html:
                  description: '内容由管理端约束；body_text 缺省时从 HTML 派生纯文本'
                  type: string
                body_text:
                  type: string
                category:
                  enum:
                    - announcement
                    - personal_update
                    - service_notice
                  type: string
                expires_time:
                  description: '空字符串为不过期；否则格式 YYYY-MM-DD HH:mm:ss'
                  pattern: '^$|^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$'
                  type: string
                necessity:
                  default: optional
                  enum:
                    - optional
                    - necessary
                  type: string
                scope:
                  enum:
                    - community
                    - personal
                  type: string
                summary_text:
                  maxLength: 320
                  type: string
                target_email:
                  description: 'scope=personal 时必填且对应用户必须存在'
                  type: string
                title:
                  maxLength: 240
                  minLength: 1
                  type: string
              required:
                - scope
                - category
                - title
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  data:
                    $ref: '#/components/schemas/AdminNotificationCreated'
                  msg:
                    description: 成功消息
                    type: string
                required:
                  - msg
                  - data
                type: object
          description: 操作成功
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '503':
          $ref: '#/components/responses/SetupRequired'
      security:
        -
          sessionAuth: []
      summary: 发送站内通知
      tags:
        - 平台管理端
      x-audience: internal
