      parameters:
        -
          in: query
          name: key
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: '文件字节；统一以 octet-stream 下载'
          headers:
            Cache-Control:
              schema:
                enum:
                  - no-store
                type: string
            Content-Disposition:
              description: 'attachment; filename=文件名'
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                enum:
                  - nosniff
                type: string
        '403':
          $ref: '#/components/responses/BusinessError'
        '404':
          $ref: '#/components/responses/BusinessError'
        '503':
          $ref: '#/components/responses/BusinessError'
      security: []
      summary: 公开下载本地文件
      tags:
        - 存储
      x-audience: internal
