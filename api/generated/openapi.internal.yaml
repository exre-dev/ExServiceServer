          nullable: true
          type: string
        plugin_slug:
          nullable: true
          type: string
        plugin_status:
          nullable: true
          type: string
      type: object
    ServerMemberPermissionsData:
      properties:
        list:
          items:
            $ref: '#/components/schemas/ServerMemberPermission'
          type: array
        member:
          $ref: '#/components/schemas/ServerPermissionMember'
      type: object
    ServerMemberRoleInput:
      properties:
        role:
          enum:
            - admin
            - member
          type: string
      required:
        - role
      type: object
    ServerMemberUser:
      properties:
        avatar:
          type: string
        email:
          type: string
        id:
          type: integer
        qq:
          nullable: true
          type: string
        username:
          type: string
      type: object
    ServerMembersData:
      properties:
        list:
          items:
            $ref: '#/components/schemas/ServerMember'
          type: array
        my_role:
          enum:
            - owner
            - admin
            - member
          type: string
      type: object
    ServerMineData:
      properties:
        list:
          items:
            $ref: '#/components/schemas/ServerManagedSpace'
          type: array
      type: object
    ServerOverviewData:
      properties:
        binding_count:
          type: integer
        ident_count:
          type: integer
        member_count:
          type: integer
        my_role:
          enum:
            - owner
            - admin
            - member
          type: string
        server:
          $ref: '#/components/schemas/ServerAccount'
      type: object
    ServerPermissionBinding:
      properties:
        expires_time:
          nullable: true
          type: string
        features:
          description: '功能键到布尔值的映射；空映射经 array cast 可输出 []'
          oneOf:
            -
              additionalProperties:
                type: boolean
              type: object
            -
              items:
                type: boolean
              maxItems: 0
              type: array
        id:
          type: integer
        plugin_id:
          type: integer
        status:
          enum:
            - active
            - revoked
            - disabled
          type: string
      type: object
    ServerPermissionMatrixData:
      properties:
        binding:
          $ref: '#/components/schemas/ServerPermissionBinding'
        features:
          items:
            $ref: '#/components/schemas/ServerFeature'
          type: array
        rows:
          items:
            $ref: '#/components/schemas/ServerPermissionRow'
          type: array
      type: object
    ServerPermissionMember:
      properties:
        avatar:
          description: 没有插件绑定时此字段省略
          nullable: true
          type: string
        email:
          nullable: true
          type: string
        role_key:
          enum:
            - owner
            - admin
            - member
          type: string
        user_id:
          type: integer
        username:
          nullable: true
          type: string
      type: object
    ServerPermissionPushData:
      properties:
        plugins:
          items:
            type: string
          type: array
      type: object
    ServerPermissionPushInput:
      properties:
        plugin_id:
          default: 0
          description: '大于 0 仅下发指定插件，省略或不大于 0 下发全部绑定插件'
          type: integer
      type: object
    ServerPermissionRow:
      properties:
        allowed:
          description: '没有覆盖记录时为 true'
          type: boolean
        email:
          nullable: true
          type: string
        features:
          description: '功能键到布尔值的映射或布尔数组；连续数字键经 PHP 数组序列化可输出非空数组，null 表示无功能覆盖'
          oneOf:
            -
              additionalProperties:
                type: boolean
              nullable: true
              type: object
            -
              items:
                type: boolean
              type: array
        has_perm_row:
          type: boolean
        role_key:
          enum:
            - owner
            - admin
            - member
          type: string
        user_id:
          type: integer
        username:
          nullable: true
          type: string
      type: object
    ServerPermissionSaveInput:
      description: '仅保留该插件已知功能键并转为 bool；features 缺失或 null 清除功能覆盖，空映射保留空覆盖记录。'
      properties:
        allowed:
          default: true
          type: boolean
        features:
          description: '功能键到布尔值的映射或布尔数组；连续数字键经 PHP 数组序列化可输出非空数组，null 表示无功能覆盖'
          oneOf:
            -
              additionalProperties:
                type: boolean
              nullable: true
              type: object
            -
              items:
                type: boolean
              type: array
        plugin_id:
          type: integer
        user_id:
          type: integer
      required:
        - plugin_id
        - user_id
      type: object
    ServerPermissionTargetInput:
      properties:
        plugin_id:
          type: integer
        user_id:
          type: integer
      required:
        - plugin_id
        - user_id
      type: object
    ServerPluginIdInput:
      properties:
        plugin_id:
          type: integer
      required:
        - plugin_id
      type: object
    ServerPluginOption:
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
      type: object
    ServerSettingsInput:
      properties:
        contact_qq:
          type: string
        description:
          type: string
        logo:
          type: string
        name:
          type: string
      type: object
    ServerUserSummary:
      properties:
        avatar:
          type: string
        email:
          type: string
        id:
          type: integer
        username:
          type: string
      type: object
    ServerVersionData:
      properties:
        version:
          type: integer
      type: object
    SsoCaptcha:
      properties:
        answer:
          minLength: 1
          type: string
        challengeId:
          minLength: 1
          type: string
      required:
        - challengeId
        - answer
      type: object
    SsoCompletedResponse:
      properties:
        data:
          properties:
            ssoRequestId:
              description: '由设备码初始化接口返回的 sso_request_id。'
              maxLength: 43
              minLength: 43
              pattern: '^[A-Za-z0-9_-]{43}$'
              type: string
            status:
              enum:
                - completed
              type: string
          required:
            - status
            - ssoRequestId
          type: object
        msg:
          type: string
      required:
        - msg
        - data
      type: object
    SsoInspectResponse:
      properties:
        data:
          properties:
            expiresAt:
              description: 'Unix 毫秒时间。'
              format: int64
              type: integer
            serverTime:
              description: 'Unix 毫秒时间。'
              format: int64
              type: integer
            ssoRequestId:
              description: '由设备码初始化接口返回的 sso_request_id。'
              maxLength: 43
              minLength: 43
              pattern: '^[A-Za-z0-9_-]{43}$'
              type: string
            status:
              enum:
                - pending
                - completed
              type: string
          required:
            - ssoRequestId
            - status
            - expiresAt
            - serverTime
          type: object
        msg:
          type: string
      required:
        - msg
        - data
      type: object
    SsoLoginRequest:
      properties:
        captcha:
          $ref: '#/components/schemas/SsoCaptcha'
        email:
          description: 登录邮箱，去除两端空白。
          type: string
        password:
          type: string
          writeOnly: true
        ssoRequestId:
          description: '由设备码初始化接口返回的 sso_request_id。'
          maxLength: 43
          minLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          type: string
      required:
        - ssoRequestId
        - email
        - password
      type: object
    SsoRequest:
      properties:
        ssoRequestId:
          description: '由设备码初始化接口返回的 sso_request_id。'
          maxLength: 43
          minLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
          type: string
      required:
        - ssoRequestId
      type: object
    StoragePrepareData:
      properties:
        maxBytes:
          enum:
            - 20971520
          type: integer
        medium:
          enum:
            - file
          type: string
      required:
        - medium
        - maxBytes
      type: object
    StoragePrepareRequest:
      properties:
        contentType:
          description: '合法 type/subtype，不接受参数'
          maxLength: 127
          type: string
        key:
          description: '小写分段路径，禁止 Windows 保留设备名'
          maxLength: 240
          minLength: 1
          pattern: '^[a-z0-9](?:[a-z0-9._-]*[a-z0-9_-])?(?:/[a-z0-9](?:[a-z0-9._-]*[a-z0-9_-])?)*$'
          type: string
        medium:
          enum:
            - file
            - cos
          type: string
        size:
          description: '超过 20MiB 返回 413'
          type: integer
      required:
        - key
        - size
        - contentType
      type: object
    StoragePrepareResponse:
      properties:
        data:
          $ref: '#/components/schemas/StoragePrepareData'
        msg:
          type: string
      required:
        - msg
        - data
      type: object
    StorageUploadData:
      properties:
        url:
          format: uri
          type: string
      required:
        - url
      type: object
    StorageUploadRequest:
      properties:
        contentType:
          description: '合法 type/subtype，不接受参数'
          maxLength: 127
          type: string
        data:
          description: '文件字节，最多 20MiB'
          format: binary
          type: string
        key:
          description: '小写分段路径，禁止 Windows 保留设备名'
          maxLength: 240
          minLength: 1
          pattern: '^[a-z0-9](?:[a-z0-9._-]*[a-z0-9_-])?(?:/[a-z0-9](?:[a-z0-9._-]*[a-z0-9_-])?)*$'
          type: string
        medium:
          enum:
            - file
          type: string
      required:
        - key
        - data
      type: object
    StorageUploadResponse:
      properties:
        data:
          $ref: '#/components/schemas/StorageUploadData'
        msg:
          type: string
      required:
        - msg
        - data
      type: object
    SystemEnvironmentCheck:
      properties:
        name:
          type: string
        passed:
          type: boolean
      required:
        - name
        - passed
      type: object
    SystemHealthData:
      properties:
        status:
          description: 健康检查与首次部署初始化的数据结构。
          enum:
            - ok
          type: string
      required:
        - status
      type: object
    SystemInstallAdminInput:
      properties:
        email:
          format: email
          maxLength: 255
          type: string
        password:
          description: '12..72 字节，至少一个字母和数字；禁止控制字符'
          format: password
          type: string
          writeOnly: true
        password_confirmation:
          description: '必须与 password 完全一致'
          format: password
          type: string
          writeOnly: true
        username:
          maxLength: 64
          minLength: 1
          type: string
      required:
        - email
        - username
        - password
        - password_confirmation
      type: object
    SystemInstallData:
      properties:
        installed:
          enum:
            - true
          type: boolean
      required:
        - installed
      type: object
    SystemInstallDatabaseInput:
      properties:
        database:
          pattern: '^[a-zA-Z0-9_-]{1,63}$'
          type: string
        host:
          maxLength: 253
          pattern: '^[a-zA-Z0-9.:-]+$'
          type: string
        password:
          description: 可为空，不提供真实示例
          type: string
          writeOnly: true
        port:
          description: '接受整数或数字字符串；数值范围 1..65535'
          oneOf:
            -
              maximum: 65535
              minimum: 1
              type: integer
            -
              pattern: '^[0-9]+$'
              type: string
        username:
          maxLength: 63
          minLength: 1
          type: string
      required:
        - host
        - port
        - database
        - username
        - password
      type: object
    SystemInstallInput:
      description: '连接信息/管理员字段仅接受字符串或整数且禁止控制字符；除 password 外 trim 后不能为空。写入 .env（存在 .env.local 时写入该本地覆盖文件）、生成 JWT 密钥并创建 install.lock；不导入 seed.sql。'
      properties:
        admin:
          $ref: '#/components/schemas/SystemInstallAdminInput'
        database:
          $ref: '#/components/schemas/SystemInstallDatabaseInput'
        force:
          default: false
          description: '必须为 JSON 布尔值；true 在事务内重建 public 下全部 app_ 业务表'
          type: boolean
        force_confirmation:
          description: 'force=true 时必须精确等于“重置数据库”'
          type: string
        redis:
          $ref: '#/components/schemas/SystemInstallRedisInput'
      required:
        - database
        - redis
        - admin
      type: object
    SystemInstallRedisInput:
      properties:
        database:
          description: '接受整数或数字字符串；数值范围 0..65535'
          oneOf:
            -
              maximum: 65535
              minimum: 0
              type: integer
            -
              pattern: '^[0-9]+$'
              type: string
        host:
          maxLength: 253
          pattern: '^[a-zA-Z0-9.:-]+$'
          type: string
        password:
          description: 可为空，不提供真实示例
          type: string
          writeOnly: true
        port:
          description: '接受整数或数字字符串；数值范围 1..65535'
          oneOf:
            -
              maximum: 65535
              minimum: 1
              type: integer
            -
              pattern: '^[0-9]+$'
              type: string
      required:
        - host
        - port
        - database
        - password
      type: object
    SystemInstallationStatusData:
      description: '已安装仅返回 installed=true；未安装返回 installed=false、checks、ready。检查 PHP >=8.1、pdo_pgsql、redis、gd、mbstring、项目及 .env 可写、schema.sql 可读。install.lock 或已有 superadmin 均视为已安装；后者可补写标记。不返回连接凭据。'
      properties:
        checks:
          items:
            $ref: '#/components/schemas/SystemEnvironmentCheck'
          type: array
        installed:
          type: boolean
        ready:
          type: boolean
      required:
        - installed
      type: object
  securitySchemes:
    sessionAuth:
      description: '本站登录会话 JWT，保留会话撤销和用户状态校验；需要登录的接口拒绝携带 client_id 的 OAuth 访问令牌，返回 401；可选鉴权接口按匿名处理。'
      scheme: bearer
      type: http
info:
  description: '由 PHP 接口元数据生成；服务器地址相对于当前部署根路径。'
  title: 'EXRE 社区 API'
  version: 1.0.0
openapi: 3.0.3
paths:
  /api/account/grants:
    get:
      description: 我授权过的应用列表
      operationId: accountGrants
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountGrantsResponse'
          description: 成功
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '503':
          $ref: '#/components/responses/SetupRequired'
      security:
        -
          sessionAuth: []
      summary: 查看本人第三方授权
      tags:
        - 账号
      x-audience: internal
  '/api/account/grants/{client_id}/revoke':
    post:
      description: '撤销对某应用的授权（该应用名下我的 token 立即失效）'
      operationId: accountRevokeGrant
      parameters:
        -
          in: path
          name: client_id
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRevokedSessionsResponse'
          description: 成功
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '503':
          $ref: '#/components/responses/SetupRequired'
      security:
        -
          sessionAuth: []
      summary: 撤销授权及关联会话
      tags:
        - 账号
      x-audience: internal
  /api/account/login:
    post:
      description: '图片验证码五分钟有效且一次性；此路径必填 captcha。'
      operationId: accountLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountAdminLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountAdminLoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLoginResponse'
          description: 成功
        '400':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '422':
          $ref: '#/components/responses/BusinessError'
        '503':
          $ref: '#/components/responses/SetupRequired'
      security: []
      summary: 登录并创建独立会话
      tags:
        - 账号
      x-audience: internal
  /api/account/logout:
    post:
      description: '登出（撤销当前会话, token 立即失效）'
      operationId: accountLogout
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEmptyResponse'
          description: 成功
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '503':
          $ref: '#/components/responses/SetupRequired'
      security:
        -
          sessionAuth: []
      summary: 撤销当前会话
      tags:
        - 账号
      x-audience: internal
  /api/account/me:
    get:
      description: 当前登录用户信息
      operationId: accountMe
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountMeResponse'
          description: 成功
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '503':
          $ref: '#/components/responses/SetupRequired'
      security:
        -
          sessionAuth: []
      summary: 当前登录用户
      tags:
        - 账号
      x-audience: internal
  /api/account/password:
    post:
      description: 修改密码（成功后下线其他全部设备）
      operationId: accountChangePassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountPasswordRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRevokedSessionsResponse'
          description: 成功
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '503':
          $ref: '#/components/responses/SetupRequired'
      security:
        -
          sessionAuth: []
      summary: 修改密码并下线其他设备
      tags:
        - 账号
      x-audience: internal
  /api/account/register:
    post:
      description: '若邮箱已发送验证码则必须匹配 code；未发送时当前实现放行。密码至少六字节。'
      operationId: accountRegister
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountRegisterRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLoginResponse'
          description: 成功
        '400':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '503':
          $ref: '#/components/responses/SetupRequired'
      security: []
      summary: 注册并自动登录
      tags:
        - 账号
      x-audience: internal
  /api/account/send-email-code:
    post:
      description: '同邮箱冷却六十秒，验证码十分钟有效。邮件失败且 debug 开启时返回 debug_code。'
      operationId: accountSendEmailCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountEmailRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccountEmailRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEmailCodeResponse'
          description: 成功
        '400':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '500':
          content:
            text/html:
              schema:
                $ref: '#/components/schemas/AccountUnhandledErrorBody'
          description: '注解限流异常由现有 ApiHandler 转成 500'
        '503':
          $ref: '#/components/responses/SetupRequired'
      security: []
      summary: 发送注册邮箱验证码
      tags:
        - 账号
      x-audience: internal
  /api/account/sessions:
    get:
      description: 我的登录会话列表（多设备/多平台）
      operationId: accountSessions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSessionsResponse'
          description: 成功
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '503':
          $ref: '#/components/responses/SetupRequired'
      security:
        -
          sessionAuth: []
      summary: 最近一百条登录会话
      tags:
        - 账号
      x-audience: internal
  /api/account/sessions/revoke-all:
    post:
      description: 下线除当前会话外的全部设备
      operationId: accountRevokeOtherSessions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountRevokeAllResponse'
          description: 成功
        '401':
          $ref: '#/components/responses/BusinessError'
        '403':
          $ref: '#/components/responses/BusinessError'
        '503':
          $ref: '#/components/responses/SetupRequired'
      security:
        -
          sessionAuth: []
      summary: 撤销除当前以外所有会话
      tags:
        - 账号
      x-audience: internal
  '/api/account/sessions/{sid}/revoke':
    post:
      description: 撤销指定会话（下线某设备）
      operationId: accountRevokeSession
      parameters:
        -
          in: path
          name: sid
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
