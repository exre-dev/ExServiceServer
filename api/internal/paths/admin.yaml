/api/admin/clients:
  get:
    description: '需要有效登录会话及平台角色 superadmin 或 ops。平台角色不足按当前实现返回400；登录态失效401，封禁或全局限流403。'
    operationId: adminClientIndex
    parameters:
      -
        description: 页码，小于1按1处理
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      -
        description: 每页数量，服务端裁剪到允许范围
        in: query
        name: page_size
        required: false
        schema:
          default: 10
          maximum: 50
          minimum: 1
          type: integer
      -
        description: 非空时筛选应用类型
        in: query
        name: type
        required: false
        schema:
          enum:
            - third_party
            - plugin
          type: string
      -
        description: 非空时按状态筛选
        in: query
        name: status
        required: false
        schema:
          enum:
            - active
            - suspended
          type: string
    responses:
      '200':
        content:
          application/json:
            schema:
              properties:
                data:
                  properties:
                    list:
                      items:
                        $ref: '../openapi.yaml#/components/schemas/AdminClientListItem'
                      type: array
                    scope_dict:
                      items:
                        type: string
                      type: array
                    total:
                      type: integer
                  type: object
                msg:
                  description: 成功消息
                  type: string
              required:
                - msg
                - data
              type: object
        description: 操作成功
      '400':
        $ref: '../openapi.yaml#/components/responses/BusinessError'
      '401':
        $ref: '../openapi.yaml#/components/responses/BusinessError'
      '403':
        $ref: '../openapi.yaml#/components/responses/BusinessError'
      '503':
        $ref: '../openapi.yaml#/components/responses/SetupRequired'
    security:
      -
        sessionAuth: []
    summary: 第三方应用列表
    tags:
      - 平台管理端
    x-audience: internal
  post:
    description: '需要有效登录会话及平台角色 superadmin 或 ops。平台角色不足按当前实现返回400；登录态失效401，封禁或全局限流403。密钥明文仅本次返回。plugin 类应用必须指定 active 空间；third_party 应用空间置空。'
    operationId: adminClientCreate
    requestBody:
      content:
        application/json:
          schema:
            properties:
              name:
                minLength: 1
                type: string
              note:
                type: string
              redirect_uris:
                default: []
                items:
                  format: uri
                  type: string
                type: array
              scopes:
                description: '自动补充 user.basic；非数组按空数组处理'
                items:
                  enum:
                    - user.basic
                    - user.email
                    - idents.read
                    - perms.read
                    - servers.read
                  type: string
                type: array
              server_id:
                description: 'type=plugin 时必填，且对应 active 空间'
                type: integer
              type:
                enum:
                  - third_party
                  - plugin
                type: string
            required:
              - name
              - type
            type: object
      required: true
    responses:
      '200':
        content:
          application/json:
            schema:
              properties:
                data:
                  $ref: '../openapi.yaml#/components/schemas/AdminClientCreated'
                msg:
                  description: 成功消息
                  type: string
              required:
                - msg
                - data
              type: object
        description: 操作成功
      '400':
        $ref: '../openapi.yaml#/components/responses/BusinessError'
      '401':
        $ref: '../openapi.yaml#/components/responses/BusinessError'
      '403':
        $ref: '../openapi.yaml#/components/responses/BusinessError'
      '503':
        $ref: '../openapi.yaml#/components/responses/SetupRequired'
    security:
      -
        sessionAuth: []
    summary: 注册第三方应用
    tags:
      - 平台管理端
    x-audience: internal
