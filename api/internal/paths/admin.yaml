/api/admin/bindings:
  get:
    description: '需要有效登录会话及平台角色 superadmin 或 ops。平台角色不足按当前实现返回400；登录态失效401，封禁或全局限流403。'
    operationId: adminBindingIndex
    parameters:
      -
        description: 页码，小于1按1处理
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      -
        description: 每页数量，服务端裁剪到允许范围
        in: query
        name: page_size
        required: false
        schema:
          default: 10
          maximum: 50
          minimum: 1
          type: integer
      -
        description: 非空时按状态筛选
        in: query
        name: status
        required: false
        schema:
          enum:
            - active
            - revoked
            - disabled
          type: string
      -
        description: 大于0时筛选空间
        in: query
        name: server_id
        required: false
        schema:
          type: integer
      -
        description: 大于0时筛选插件
        in: query
        name: plugin_id
        required: false
        schema:
          type: integer
      -
        description: 关键词，去除首尾空白后模糊搜索
        in: query
        name: keyword
        required: false
        schema:
          type: string
    responses:
      '200':
        content:
          application/json:
            schema:
              properties:
                data:
                  properties:
                    list:
                      items:
                        $ref: '../openapi.yaml#/components/schemas/AdminBindingListItem'
                      type: array
                    total:
                      type: integer
                  type: object
                msg:
                  description: 成功消息
                  type: string
              required:
                - msg
                - data
              type: object
        description: 操作成功
      '400':
        $ref: '../openapi.yaml#/components/responses/BusinessError'
      '401':
        $ref: '../openapi.yaml#/components/responses/BusinessError'
      '403':
        $ref: '../openapi.yaml#/components/responses/BusinessError'
      '503':
        $ref: '../openapi.yaml#/components/responses/SetupRequired'
    security:
      -
        sessionAuth: []
    summary: 全局绑定码列表
    tags:
      - 平台管理端
    x-audience: internal
