    requestBody:
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/NotificationPreferencesRequest'
      required: true
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/NotificationPreferencesResponse'
        description: 成功
      '400':
        $ref: '../openapi.yaml#/components/responses/BusinessError'
      '401':
        $ref: '../openapi.yaml#/components/responses/BusinessError'
      '403':
        $ref: '../openapi.yaml#/components/responses/BusinessError'
      '409':
        $ref: '../openapi.yaml#/components/responses/BusinessError'
      '503':
        $ref: '../openapi.yaml#/components/responses/SetupRequired'
    security:
      - sessionAuth: []
