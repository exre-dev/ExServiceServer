/api/notifications:
  get:
    description: '通知列表（keyset 分页, view=unread|history）'
    operationId: notificationList
    parameters:
      - in: query
        name: view
        required: true
        schema:
          enum:
            - unread
            - history
          type: string
      - in: query
        name: scope
        required: false
        schema:
          default: all
          enum:
            - all
            - community
            - personal
          type: string
      - in: query
        name: category
        required: false
        schema:
          enum:
            - announcement
            - personal_update
            - service_notice
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 20
          description: '取值 1 至 50；越界时回退到 20'
          type: integer
      - in: query
        name: cursor
        required: false
        schema:
          type: string
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/NotificationListResponse'
        description: 成功
      '400':
        $ref: '../openapi.yaml#/components/responses/BusinessError'
      '401':
        $ref: '../openapi.yaml#/components/responses/BusinessError'
      '403':
        $ref: '../openapi.yaml#/components/responses/BusinessError'
      '503':
        $ref: '../openapi.yaml#/components/responses/SetupRequired'
    security:
      - sessionAuth: []
    summary: 通知列表与签名游标分页
    tags:
      - 通知
    x-audience: internal
