      required: true
    responses:
      '200':
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/OAuthAuthorizationConfirmResponse'
        description: 操作成功。
      '400':
        $ref: '../openapi.yaml#/components/responses/BusinessError'
      '401':
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/BusinessErrorBody'
        description: 登录态或客户端凭证无效、访问令牌无效或授权已撤销。
      '403':
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/BusinessErrorBody'
        description: 身份被禁用、绑定码缺失或无效，或请求频率受限。
      '503':
        $ref: '../openapi.yaml#/components/responses/SetupRequired'
    security:
      -
        sessionAuth: []
    summary: 确认网页授权并返回回调地址
    tags:
      - '内部 OAuth'
    x-audience: internal
/api/oauth/device/verify:
  post:
    description: '需要用户会话；校验用户码和应用状态，创建授权关系并原子确认设备。无效、过期或已使用用户码返回 400，并发状态变化返回 409。'
