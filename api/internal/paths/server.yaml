/api/server/mine:
  get:
    description: '需登录；仅返回当前用户 active owner/admin 成员关系对应的 active 空间。不经过 ServerMember。'
    operationId: serverMine
    responses:
      '200':
        content:
          application/json:
            schema:
              properties:
                data:
                  $ref: '../openapi.yaml#/components/schemas/ServerMineData'
                msg:
                  type: string
              required:
                - msg
                - data
              type: object
        description: 成功
      '400':
        $ref: '../openapi.yaml#/components/responses/BusinessError'
      '401':
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/BusinessErrorBody'
        description: 登录态缺失、无效、过期、撤销或用户不存在
      '403':
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/BusinessErrorBody'
        description: '平台封禁或 IP 错误请求限流'
      '503':
        $ref: '../openapi.yaml#/components/responses/SetupRequired'
    security:
      - sessionAuth: []
    summary: 我管理的空间
    tags:
      - 空间管理
    x-audience: internal
