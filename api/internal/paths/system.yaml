/api/health:
  get:
    description: '免登录，仍受首次安装保护。执行一次用户表查询和 Redis ping；任一连接异常由 ApiHandler 返回 HTTP 500。'
    operationId: systemHealth
    responses:
      '200':
        content:
          application/json:
            schema:
              properties:
                data:
                  $ref: '../openapi.yaml#/components/schemas/SystemHealthData'
                msg:
                  type: string
              required:
                - msg
                - data
              type: object
        description: 成功
      '403':
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/BusinessErrorBody'
        description: 'IP 错误请求限流'
      '500':
        content:
          text/html:
            schema:
              description: 'JSON 文本，解码后包含字符串 message 字段'
              example: '{"message":"数据库检查异常"}'
              type: string
        description: '数据库或 Redis 检查异常；现有异常处理器返回 JSON 编码的 {message} 文本，响应沿用 text/html 类型'
      '503':
        $ref: '../openapi.yaml#/components/responses/SetupRequired'
    security: []
    summary: '数据库与 Redis 健康检查'
    tags:
      - 系统
    x-audience: internal
/api/installation/install:
  post:
    description: '免登录。必须携带 X-Setup-Request: 1；如提供 Origin，其主机与端口必须等于请求 Host（否则 403）。已安装、本机安装锁竞争、数据库 advisory lock 竞争、已有 app_ 表但未 force 均返回 409。环境不就绪、输入不合法、Redis 读写失败、数据库连接或建表失败返回 400。force=true 必须同时给出 force_confirmation=重置数据库，在事务内重建 public 下 app_ 业务表；外部依赖保护仍生效。创建首个 superadmin，写入数据库/Redis 配置及随机 JWT 密钥，保留其他环境项，不回传密码。'
    operationId: systemInstallationInstall
    parameters:
      -
        description: '固定值 1；初始化页面专用请求头'
        in: header
        name: X-Setup-Request
        required: true
        schema:
          enum:
            - '1'
          type: string
      -
        description: '可选；存在时主机和端口必须与 Host 相同'
        in: header
        name: Origin
        required: false
        schema:
          type: string
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../openapi.yaml#/components/schemas/SystemInstallInput'
      required: true
    responses:
      '200':
        content:
          application/json:
            schema:
              properties:
                data:
                  $ref: '../openapi.yaml#/components/schemas/SystemInstallData'
                msg:
                  type: string
              required:
                - msg
                - data
              type: object
        description: 成功
      '400':
        $ref: '../openapi.yaml#/components/responses/BusinessError'
      '403':
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/BusinessErrorBody'
        description: '初始化请求头缺失或 Origin 主机/端口不匹配；也可能触发 IP 错误请求限流'
      '409':
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/BusinessErrorBody'
        description: 已经安装、安装锁竞争，或数据库存在业务表但未选择强制初始化
    security: []
    summary: 首次部署初始化
    tags:
      - 系统
    x-audience: internal
/api/installation/status:
  get:
    description: '免登录，跳过首次安装保护。已安装仅返回 installed=true；否则检查 PHP/扩展、目录及配置可写和数据库脚本可读。检测已有 superadmin 时可补写 install.lock；不返回配置凭据。'
    operationId: systemInstallationStatus
    responses:
      '200':
        content:
          application/json:
            schema:
              properties:
                data:
                  $ref: '../openapi.yaml#/components/schemas/SystemInstallationStatusData'
                msg:
                  type: string
              required:
                - msg
                - data
              type: object
        description: 成功
        headers:
          Cache-Control:
            schema:
              enum:
                - no-store
              type: string
      '403':
        content:
          application/json:
            schema:
              $ref: '../openapi.yaml#/components/schemas/BusinessErrorBody'
        description: 'IP 错误请求限流'
    security: []
    summary: 初始化状态和环境检查
    tags:
      - 系统
    x-audience: internal
