    operationId: authInvitationCode
    requestBody:
      content:
        application/json:
          schema:
            $ref: '../schemas/account.yaml#/AccountEmailRequest'
        application/x-www-form-urlencoded:
          schema:
            $ref: '../schemas/account.yaml#/AccountEmailRequest'
      required: true
    responses:
      '202':
        content:
          application/json:
            schema:
              $ref: '../schemas/account.yaml#/AccountInvitationCodeResponse'
        description: 成功
      '400':
        $ref: '../openapi.yaml#/components/responses/BusinessError'
      '403':
        $ref: '../openapi.yaml#/components/responses/BusinessError'
      '409':
        $ref: '../openapi.yaml#/components/responses/BusinessError'
      '429':
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/BusinessErrorBody'
        description: 发送冷却或连续失败锁定
        headers:
          Retry-After:
            description: 剩余等待秒数
            schema:
              type: integer
      '503':
