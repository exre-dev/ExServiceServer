AdminAuditLog:
  description: '审计日志；detail 为各动作自己的 JSON 详情。'
  properties:
    action:
      description: '动作名,如 user.login / binding.revoke'
      type: string
    actor_type:
      description: '操作者类型: platform/server/user/client'
      type: string
    actor_user_id:
      description: '操作者用户id,系统操作为空'
      nullable: true
      type: integer
    client_id:
      description: 相关应用client_id
      nullable: true
      type: string
    created_time:
      description: 记录时间
      nullable: true
      type: string
