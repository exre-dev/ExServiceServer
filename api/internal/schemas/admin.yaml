    id:
      description: 主键
      type: integer
    ip:
      description: 来源IP
      type: string
    server_id:
      description: 相关空间id
      nullable: true
      type: integer
    target_id:
      description: 目标id
      type: string
    target_type:
      description: 目标类型
      type: string
  type: object
AdminAuthSession:
  description: '会话完整字段，包括当前模型未隐藏的 ua_hash。'
  properties:
    client_id:
      description: OAuth时关联的应用client_id
      nullable: true
      type: string
    created_time:
      description: 登录时间
      nullable: true
      type: string
    device_name:
      description: 设备名(UA自动识别)
      type: string
    expires_time:
      description: 会话过期时间
      nullable: true
      type: string
    id:
      description: '会话id,即JWT中的sid'
      type: integer
    ip:
      description: 登录来源IP
      type: string
    last_used_time:
      description: 最近使用时间
      nullable: true
      type: string
    login_type:
      description: '登录方式: password/oauth'
      type: string
    platform:
      description: '平台: web/fivem/third_party'
      type: string
    scope:
      description: OAuth时授予的scope
      type: string
    status:
      description: '状态: active/revoked/expired'
      type: string
    ua_hash:
      description: UA摘要
      type: string
    updated_time:
      description: 更新时间
      nullable: true
      type: string
    user_id:
      description: 归属用户id
      type: integer
  type: object
AdminBindingListItem:
  description: '全局绑定码列表；health：inactive 非 active、never 未心跳、stale 超过1800秒、ok 正常。'
  properties:
    code:
      description: '绑定码 EX-XXXX-XXXX-XXXX-XXXX-XXXX'
      type: string
    created_by:
      description: 生成者用户id
      nullable: true
      type: integer
    created_time:
      description: 创建时间
      nullable: true
      type: string
    expires_time:
      description: '过期时间,空=长期'
      nullable: true
      type: string
    features:
      description: '功能键到布尔值的映射；空映射经模型 array cast 输出 []'
      oneOf:
        -
          additionalProperties:
            type: boolean
          type: object
        -
          items:
            type: boolean
          maxItems: 0
          type: array
    health:
      enum:
        - inactive
        - never
        - stale
        - ok
      type: string
    id:
      description: 主键
      type: integer
    last_heartbeat:
      description: 最近心跳时间
      nullable: true
      type: string
    last_heartbeat_ip:
      description: 最近心跳来源IP
      type: string
    plugin:
      oneOf:
        -
          $ref: '../openapi.yaml#/components/schemas/AdminPluginBrief'
        -
          enum:
            - null
          nullable: true
          type: object
    plugin_id:
      description: 插件id
      type: integer
    server:
      oneOf:
        -
          $ref: '../openapi.yaml#/components/schemas/AdminServerStateBrief'
        -
          enum:
            - null
          nullable: true
          type: object
    server_id:
      description: 空间id
      type: integer
    server_key_hash:
      description: '首次校验锁定的sv_licenseKey SHA-256'
      type: string
    status:
      description: '状态: active/revoked/disabled'
      type: string
    updated_time:
      description: 更新时间
      nullable: true
      type: string
  type: object
