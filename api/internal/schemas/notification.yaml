NotificationAction:
  properties:
    actionId:
      type: string
    emphasis:
      type: string
    enabled:
      type: boolean
    kind:
      type: string
    label:
      type: string
    navigationTarget:
      $ref: '../openapi.yaml#/components/schemas/NotificationNavigationTarget'
    unavailableReason:
      enum:
        - expired
        - unsupported
        - null
      nullable: true
      type: string
  required:
    - actionId
    - kind
    - label
    - emphasis
    - enabled
    - unavailableReason
    - navigationTarget
  type: object
NotificationClearAllData:
  properties:
    affectedCount:
      type: integer
    batchId:
      type: string
    replayed:
      type: boolean
    requestId:
      type: string
    serverTime:
      description: 'Unix 时间戳（毫秒）'
      format: int64
      type: integer
    skippedCount:
      type: integer
    unreadCount:
      type: integer
  required:
    - requestId
    - batchId
    - affectedCount
    - skippedCount
    - unreadCount
    - replayed
    - serverTime
  type: object
NotificationClearAllRequest:
  properties:
    clearSnapshotToken:
      type: string
    requestId:
      description: 十分钟幂等结果键；全部已读与清理共用命名空间
      type: string
  required:
    - requestId
    - clearSnapshotToken
  type: object
NotificationClearAllResponse:
  properties:
    data:
      $ref: '../openapi.yaml#/components/schemas/NotificationClearAllData'
    msg:
      type: string
  required:
    - msg
    - data
  type: object
NotificationClearPreviewData:
  properties:
    batchId:
      format: uuid
      type: string
    clearSnapshotToken:
      description: 绑定用户、批次及上界，十分钟有效
      type: string
    expiresAt:
      description: 'Unix 时间戳（毫秒）'
      format: int64
      type: integer
    itemCount:
      type: integer
    serverTime:
      description: 'Unix 时间戳（毫秒）'
      format: int64
      type: integer
    upperSequence:
      type: integer
  required:
    - batchId
    - itemCount
    - upperSequence
    - clearSnapshotToken
    - expiresAt
    - serverTime
  type: object
NotificationClearPreviewResponse:
  properties:
    data:
      $ref: '../openapi.yaml#/components/schemas/NotificationClearPreviewData'
    msg:
      type: string
  required:
    - msg
    - data
  type: object
NotificationContent:
  nullable: true
  properties:
    format:
      enum:
        - html
      type: string
    html:
      type: string
    policyVersion:
      enum:
        - notification-html-v1
      type: string
    schemaVersion:
      enum:
        - 1
      type: integer
    text:
      type: string
  required:
    - format
    - schemaVersion
    - policyVersion
    - html
    - text
  type: object
NotificationDetailData:
  properties:
    actions:
      items:
        $ref: '../openapi.yaml#/components/schemas/NotificationAction'
      type: array
    actionsAvailable:
      type: boolean
    category:
      enum:
        - announcement
        - personal_update
        - service_notice
      type: string
    clearRevision:
      type: integer
    clearedAt:
      enum:
        - null
      nullable: true
      type: integer
    content:
      $ref: '../openapi.yaml#/components/schemas/NotificationContent'
    contentAvailable:
      type: boolean
    contentFallbackText:
      nullable: true
      type: string
    deliveredAt:
      description: 'Unix 时间戳（毫秒）'
      format: int64
      type: integer
    lifecycle:
      enum:
        - active
        - expired
      type: string
    necessity:
      enum:
        - optional
        - necessary
      type: string
    readAt:
      description: 'Unix 时间戳（毫秒）'
      format: int64
      nullable: true
      type: integer
    receiptId:
      format: uuid
      type: string
    scope:
      enum:
        - community
        - personal
      type: string
    sequence:
      type: integer
    serverTime:
      description: 'Unix 时间戳（毫秒）'
      format: int64
      type: integer
    stateRevision:
      type: integer
    title:
      type: string
  required:
    - receiptId
    - title
    - scope
    - category
    - necessity
    - sequence
    - deliveredAt
    - readAt
    - clearedAt
    - lifecycle
    - stateRevision
    - clearRevision
    - contentAvailable
    - content
    - contentFallbackText
    - actions
    - actionsAvailable
    - serverTime
  type: object
NotificationDetailResponse:
  properties:
    data:
      $ref: '../openapi.yaml#/components/schemas/NotificationDetailData'
    msg:
      type: string
  required:
    - msg
    - data
  type: object
NotificationItem:
